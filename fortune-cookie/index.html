<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receive Inspiration</title>
<style>
  :root{
    --navy: #16294f;
    --navy-soft: #2a3f6b;
    --paper: #faf6ea;
    --paper-shadow: rgba(22,41,79,0.25);
    --gold: #cf9b3a;
  }

  @font-face {
    /* Times New Roman is a system font; fall back gracefully */
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fbe9a8;
    font-family: "Times New Roman", Times, Georgia, serif;
  }

  /* ---------------- BACKGROUND ---------------- */
  .bg-wrap{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    z-index:0;
  }

  .bg-img{
    width:180vmax;
    height:180vmax;
    object-fit:cover;
    transform-origin:center center;
    animation: spin 55s linear infinite;
    will-change: transform;
  }

  @keyframes spin{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-img{ animation: none; }
  }

  /* ---------------- LAYOUT ---------------- */
  .stage{
    position:fixed;
    inset:0;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding: 5vh 6vw 5vh;
    text-align:center;
  }

  .headline{
    color:var(--navy);
    font-weight:700;
    font-size: clamp(28px, 6vw, 64px);
    letter-spacing: 0.04em;
    margin:0;
    opacity:1;
    transition: opacity 0.6s ease;
    text-shadow: 0 2px 10px rgba(255,255,255,0.5);
  }

  .headline.fade{
    opacity:0;
  }

  .center-area{
    position:relative;
    flex:1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---------------- COOKIE + WRAPPER ---------------- */
  .cookie-stage{
    position:relative;
    width: min(46vmin, 380px);
    height: min(46vmin, 380px);
    cursor:pointer;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
  }

  .cookie-stage.hoverable:hover{
    transform: scale(1.08);
  }

  .cookie-stage img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
    filter: drop-shadow(0 18px 30px rgba(22,41,79,0.35));
  }

  #img-wrapper{
    z-index:3;
    transition: opacity 0.7s ease;
    transform: scale(1.35);
    transform-origin: 50% 50%;
  }
  #img-wrapper.gone{
    opacity:0;
    pointer-events:none;
  }

  #img-cookie{
    z-index:2;
    transition: opacity 0.5s ease;
  }
  #img-cookie.bounce{
    animation: cookie-bounce 0.4s cubic-bezier(.36,1.9,.4,1);
  }
  #img-cookie.broken{
    opacity:0;
  }

  @keyframes cookie-bounce{
    0%{   transform: scale(1)      translateY(0); }
    30%{  transform: scale(0.9,1.08) translateY(2%); }
    55%{  transform: scale(1.08,0.92) translateY(-6%); }
    75%{  transform: scale(0.97,1.03) translateY(2%); }
    100%{ transform: scale(1)      translateY(0); }
  }

  #img-cracked1, #img-cracked2{
    z-index:4;
    opacity:0;
  }
  #img-cracked1.fly{
    animation: fly-left 1.1s ease forwards;
  }
  #img-cracked2.fly{
    animation: fly-right 1.1s ease forwards;
  }

  @keyframes fly-left{
    0%{ opacity:1; transform: translate(0,0) rotate(0deg) scale(1); }
    100%{ opacity:0; transform: translate(-70%, 10%) rotate(-35deg) scale(0.85); }
  }
  @keyframes fly-right{
    0%{ opacity:1; transform: translate(0,0) rotate(0deg) scale(1); }
    100%{ opacity:0; transform: translate(70%, 10%) rotate(35deg) scale(0.85); }
  }

  /* ---------------- FORTUNE PAPER ---------------- */
  .paper{
    position:absolute;
    left:50%;
    top:50%;
    transform: translate(-50%,-50%) scale(0.15);
    width: min(64vmin, 560px);
    min-height: 150px;
    padding: clamp(26px, 6vw, 46px) clamp(46px, 11vw, 76px);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background-image: url('assets/paper.png');
    background-repeat: no-repeat;
    background-size: 100% 100%;
    filter: drop-shadow(0 20px 30px var(--paper-shadow));
    opacity:0;
    z-index:5;
    transition: opacity 0.3s ease, width 0.7s cubic-bezier(.2,.9,.25,1), min-height 0.7s cubic-bezier(.2,.9,.25,1), filter 0.7s ease;
  }

  .paper.show{
    opacity:1;
  }

  .paper.grow{
    animation: paper-grow 1.05s cubic-bezier(.2,.9,.25,1) forwards;
  }

  @keyframes paper-grow{
    0%{ transform: translate(-50%,-50%) scale(0.12); }
    70%{ transform: translate(-50%,-50%) scale(1.06); }
    100%{ transform: translate(-50%,-50%) scale(1); }
  }

  .paper.expanded{
    width: min(74vmin, 660px);
    min-height: 190px;
    filter: drop-shadow(0 26px 40px var(--paper-shadow));
  }

  .paper-text{
    color: var(--navy);
    font-size: clamp(14px, 1.8vw, 19px);
    line-height:1.45;
    font-style: italic;
    font-weight:700;
    opacity:0;
    transition: opacity 0.8s ease 0.15s;
  }
  .paper-text.show{
    opacity:1;
  }

  /* ---------------- FOOTER ---------------- */
  .footer{
    color: var(--navy);
    min-height: 3.2em;
  }

  .footer-line1{
    font-size: clamp(12px, 1.7vw, 16px);
    letter-spacing: 0.08em;
    opacity:1;
    transition: opacity 0.6s ease;
  }
  .footer-line1.fade{
    opacity:0;
  }

  .footer-line2{
    margin-top:6px;
    font-size: clamp(12px, 1.7vw, 16px);
    font-weight:700;
    letter-spacing: 0.06em;
    cursor:pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    opacity:0;
    transition: opacity 0.6s ease, transform 0.15s ease;
    pointer-events:none;
  }
  .footer-line2.show{
    opacity:1;
    pointer-events:auto;
  }
  .footer-line2:hover{
    transform: scale(1.04);
  }
  .footer-line2.hide{
    opacity:0 !important;
    pointer-events:none !important;
  }

  .footer-line3{
    margin-top:6px;
    font-size: clamp(11px, 1.5vw, 14px);
    letter-spacing: 0.06em;
    opacity:0;
    transition: opacity 0.6s ease;
  }
  .footer-line3.show{
    opacity:0.85;
  }

  .sound-hint{
    position:fixed;
    bottom:10px;
    right:14px;
    font-size:11px;
    color: var(--navy-soft);
    opacity:0.55;
    z-index:6;
    letter-spacing:0.05em;
    font-family: Georgia, serif;
  }
</style>
</head>

  function startBgm(){
    if(audioStarted) return;
    audioStarted = true;
    bgm.volume = 0.55;
    bgm.play().catch(function(){});
    if(soundHint) soundHint.style.display = "none";
  }
  document.addEventListener("pointerdown", startBgm, {once:true});

  var lastHitSrc = null;
  var lastHitStreak = 0;

  function playHit(){
    var candidates = hitSrcs;
    if(lastHitStreak >= 2){
      candidates = hitSrcs.filter(function(s){ return s !== lastHitSrc; });
    }
    var src = candidates[Math.floor(Math.random() * candidates.length)];

    if(src === lastHitSrc){
      lastHitStreak++;
    } else {
      lastHitSrc = src;
      lastHitStreak = 1;
    }

    var a = new Audio(src);
    a.volume = 0.85;
    a.play().catch(function(){});
  }

  var CATEGORY_RULES = [
    ["music",       /\b(song|beat|album|chorus|lyrics|drum|drums)\b/],
    ["photography", /\b(photograph|photo|picture)\b/],
    ["film",        /\b(film|video|documentary)\b/],
    ["painting",    /\bpaint(s|ed|ing)?\b/],
    ["drawing",     /\bdraw(ing|s)?\b/],
    ["writing",     /\b(write|writing|poem|story|letter)\b/],
    ["fashion",     /\b(shirt|clothing|jacket|outfit|fashion|uniform)\b/],
    ["design",      /\bdesign\b/]
  ];

  function categorize(text){
    var t = text.toLowerCase();
    for(var i = 0; i < CATEGORY_RULES.length; i++){
      if(CATEGORY_RULES[i][1].test(t)) return CATEGORY_RULES[i][0];
    }
    return "general";
  }

  function pickFortune(excludeText, excludeCategory){
    var pool = FORTUNES.filter(function(f){
      if(excludeText && f === excludeText) return false;
      if(excludeCategory && categorize(f) === excludeCategory) return false;
      return true;
    });
    if(pool.length === 0){
      pool = FORTUNES.filter(function(f){ return !excludeText || f !== excludeText; });
    }
    if(pool.length === 0){
      pool = FORTUNES;
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }

      headline.classList.remove("fade");

    stageState = "cracking";

    sfxPlastic.play().catch(function(){});
    imgWrapper.classList.add("gone");

    setHeadline("BREAK THE COOKIE");
    footerLine1.classList.add("fade");
  }

  function handleCookieClick(){
    if(stageState === "unwrapped"){
      crackWrapperOff();
      return;
    }
    if(stageState !== "cracking") return;

    clickCount++;
    playHit();
    imgCookie.classList.remove("bounce");
    void imgCookie.offsetWidth; // restart animation
    imgCookie.classList.add("bounce");

    if(COOKIE_STAGE_IMAGES[clickCount]){
      imgCookie.src = COOKIE_STAGE_IMAGES[clickCount];
    }

    if(clickCount >= CLICKS_TO_BREAK){
      breakCookie();
    }
  }

    stageState = "broken";
    cookieStage.classList.remove("hoverable");

    var fortune = pickFortune(null, localStorage.getItem(STORAGE_KEY_CATEGORY));

    revealPaper(fortune, function(){
      localStorage.setItem(STORAGE_KEY_FORTUNE, fortune);
      localStorage.setItem(STORAGE_KEY_CATEGORY, categorize(fortune));

      if(isRerollFlow){
        isRerollFlow = false;
        setHeadline("NOW GO CREATE.");
        footerLine1.classList.remove("fade");
        footerLine3.classList.add("show");
        updateRerollButtonState(parseInt(localStorage.getItem(STORAGE_KEY_REROLL) || "0", 10));
        startCountdown(parseInt(localStorage.getItem(STORAGE_KEY_NEXT), 10));
      } else {
        var nextTime = Date.now() + DAY_MS;
        localStorage.setItem(STORAGE_KEY_NEXT, String(nextTime));
        localStorage.setItem(STORAGE_KEY_REROLL, "0");
        setHeadline("NOW GO CREATE.");
        showFinalFooter();
        startCountdown(nextTime);
      }
    });
  }

  function revealPaper(fortuneText, onComplete){
    paperText.textContent = fortuneText;
    paper.classList.add("show");

    setTimeout(function(){
      paper.classList.add("grow");
      sfxPaper.currentTime = 0;
      sfxPaper.play().catch(function(){});
      setTimeout(function(){
        paperText.classList.add("show");
      }, 500);
    }, 550);

    setTimeout(function(){
      paper.classList.add("expanded");
    }, 1150);

    setTimeout(function(){
      if(onComplete) onComplete();
    }, 1900);
  }

  var MAX_REROLLS = 2;
  var REROLL_LABEL_DEFAULT = "NOT FEELING IT? REROLL";
  var REROLL_LABEL_LAST = "ONE LAST REROLL";

  function updateRerollButtonState(count){
    if(count >= MAX_REROLLS){
      footerLine2.classList.add("hide");
      return;
    }
    footerLine2.textContent = (count === 1) ? REROLL_LABEL_LAST : REROLL_LABEL_DEFAULT;
    footerLine2.classList.remove("hide");
    footerLine2.classList.add("show");
  }

  function showFinalFooter(){
    footerLine1.classList.remove("fade");
    updateRerollButtonState(0);
    footerLine3.classList.add("show");
  }

  function startUnwrapSequence(){
    stageState = "unwrapped";
    clickCount = 0;

    imgWrapper.classList.remove("gone");
    imgCookie.classList.remove("broken");
    imgCookie.classList.remove("bounce");
    imgCookie.src = "assets/fortunecookie.png";
    imgCracked1.classList.remove("fly");
    imgCracked2.classList.remove("fly");
    paper.classList.remove("show", "grow", "expanded");
    paper.style.transform = "";
    paperText.classList.remove("show");
    cookieStage.classList.add("hoverable");

    setHeadline("RECEIVE INSPIRATION");
    footerLine1.textContent = "OPEN A FORTUNE COOKIE. MAKE SOMETHING NEW.";
    footerLine1.classList.remove("fade");
    footerLine3.classList.remove("show");
  }

  footerLine2.addEventListener("click", function(){
    if(footerLine2.classList.contains("hide")) return;
    if(stageState !== "broken") return;

    var count = parseInt(localStorage.getItem(STORAGE_KEY_REROLL) || "0", 10);
    if(count >= MAX_REROLLS) return;

    count++;
    localStorage.setItem(STORAGE_KEY_REROLL, String(count));

    isRerollFlow = true;
    if(countdownInterval) clearInterval(countdownInterval);
    footerLine2.classList.add("hide");
    footerLine2.classList.remove("show");

    startUnwrapSequence();
  });

  var countdownInterval = null;
  function startCountdown(nextTime){
    if(countdownInterval) clearInterval(countdownInterval);
    updateCountdown(nextTime);
    countdownInterval = setInterval(function(){
      updateCountdown(nextTime);
    }, 1000);
  }

  function updateCountdown(nextTime){
    var remaining = nextTime - Date.now();
    if(remaining <= 0){
      clearInterval(countdownInterval);
      resetExperience();
      return;
    }
    var h = Math.floor(remaining / 3600000);
    var m = Math.floor((remaining % 3600000) / 60000);
    var s = Math.floor((remaining % 60000) / 1000);
    function pad(n){ return (n < 10 ? "0" : "") + n; }
    footerLine1.textContent = "ANOTHER FORTUNE IN 24 HOURS: " + pad(h) + ":" + pad(m) + ":" + pad(s);
  }

  function resetExperience(){
    localStorage.removeItem(STORAGE_KEY_NEXT);
    localStorage.removeItem(STORAGE_KEY_FORTUNE);
    localStorage.removeItem(STORAGE_KEY_REROLL);
    window.location.reload();
  }

  function restoreFromStorage(){
    var nextTimeStr = localStorage.getItem(STORAGE_KEY_NEXT);
    if(!nextTimeStr) return false;
    var nextTime = parseInt(nextTimeStr, 10);
    if(isNaN(nextTime) || Date.now() >= nextTime){
      localStorage.removeItem(STORAGE_KEY_NEXT);
      localStorage.removeItem(STORAGE_KEY_FORTUNE);
      localStorage.removeItem(STORAGE_KEY_REROLL);
      return false;
    }

    stageState = "broken";
    cookieStage.classList.remove("hoverable");
    imgWrapper.classList.add("gone");
    imgCookie.classList.add("broken");
    imgCracked1.style.display = "none";
    imgCracked2.style.display = "none";

    var fortune = localStorage.getItem(STORAGE_KEY_FORTUNE) || pickFortune();
    paperText.textContent = fortune;
    paper.classList.add("show");
    paper.classList.add("expanded");
    paper.style.transform = "translate(-50%,-50%) scale(1)";
    paperText.classList.add("show");

    headline.textContent = "NOW GO CREATE.";
    footerLine1.classList.remove("fade");
    footerLine3.classList.add("show");
    updateRerollButtonState(parseInt(localStorage.getItem(STORAGE_KEY_REROLL) || "0", 10));

    startCountdown(nextTime);
    return true;
  }

  restoreFromStorage();

})();
</script>
</body>
</html>
