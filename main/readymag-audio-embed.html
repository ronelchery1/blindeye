<div id="audio-embed" style="position:relative;width:0;height:0;">
  <audio id="bg-audio" src="https://YOUR-HOSTED-URL/audio.mp3" loop preload="auto"></audio>
  <div id="tap-overlay" style="
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.5);
      color:#fff;
      align-items:center;
      justify-content:center;
      font-family:system-ui, sans-serif;
      font-size:14px;
      letter-spacing:0.02em;
      cursor:pointer;
      text-align:center;
      z-index:9999;
      padding:1rem;">
    Tap to enable sound
  </div>
</div>

<script>
  (function () {
    var audio = document.getElementById('bg-audio');
    var overlay = document.getElementById('tap-overlay');

    function tryPlay() {
      var p = audio.play();
      if (p !== undefined) {
        p.catch(function () {
          overlay.style.display = 'flex';
        });
      }
    }

    overlay.addEventListener('click', function () {
      audio.play();
      overlay.style.display = 'none';
    });

    tryPlay();
  })();
</script>
